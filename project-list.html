<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Projects — Bettie Zhao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@18..144,600&family=Noto+Sans+SC:wght@400;500&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/project-list.css">
  </head>
  <body>
    <div class="project-page">
      <header class="site-header">
        <nav class="site-navigation" aria-label="Main navigation">
          <div class="brand">
            <span class="brand-name">BETTIE ZHAO</span>
            <span class="brand-swatch" aria-hidden="true"></span>
          </div>
          <ul class="navigation-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="project-list.html">PROJECT</a></li>
            <li>RESUME</li>
            <li>CONTACT</li>
            <li class="language-label">En/中</li>
          </ul>
        </nav>
        <span class="crop-mark crop-mark--top-left"><img src="assets/decorations/crop-mark-top-left.svg" alt=""></span>
        <span class="crop-mark crop-mark--top-right"><img src="assets/decorations/crop-mark-top-right.svg" alt=""></span>
      </header>

      <main class="project-list-panel" aria-label="Selected projects">
        <section class="project-entry project-entry--hmi" aria-labelledby="hmi-title">
          <div class="project-entry__heading project-entry__heading--hmi">
            <span class="project-entry__number">01</span>
            <span class="project-entry__label">HMI</span>
          </div>
          <div class="project-artwork project-artwork--hmi">
            <img class="project-mockup project-mockup--hmi" src="assets/projects/hmi-mockup.svg" alt="HMI robot maintenance system desktop interface">
          </div>
          <div class="project-copy project-copy--hmi">
            <h1 id="hmi-title">机器人运维系统设计</h1>
            <p>整合远程接管与任务管理能力，重新组织工业机器人运维界面的信息架构与操作流程。</p>
            <div class="project-categories" aria-label="Project categories">
              <span>PRODUCT DESIGN </span><b>· </b><span>B2B </span><b>·</b><span> INTERNSHIP </span>
            </div>
            <div class="project-view"><span>VIEW</span><img src="assets/illustrations/arrow-right.svg" alt=""></div>
          </div>
        </section>

        <section class="project-entry project-entry--wego" aria-labelledby="wego-title">
          <div class="project-entry__heading project-entry__heading--wego">
            <span class="project-entry__number project-entry__number--padded">02</span>
            <h2 class="project-entry__label" id="wego-title">Wego</h2>
          </div>
          <div class="project-artwork project-artwork--wego">
            <img class="project-mockup project-mockup--wego" src="assets/projects/wego-mockup.svg" alt="Wego mobile app shown in a phone mockup">
          </div>
        </section>

        <section class="project-entry project-entry--urt" aria-labelledby="urt-title">
          <div class="project-entry__heading project-entry__heading--urt">
            <span class="project-entry__number">03</span>
            <h2 class="project-entry__label" id="urt-title">URT Website</h2>
          </div>
          <div class="project-artwork project-artwork--urt">
            <img class="project-mockup project-mockup--urt" src="assets/projects/urt-mockup.svg" alt="URT engineering team website shown in a desktop browser mockup">
          </div>
        </section>
      </main>

      <span class="crop-mark crop-mark--bottom-left crop-mark--project-bottom-left"><img src="assets/decorations/crop-mark-top-left.svg" alt=""></span>
      <span class="crop-mark crop-mark--bottom-right crop-mark--project-bottom"><img src="assets/decorations/crop-mark-bottom-right.svg" alt=""></span>
    </div>
  </body>
</html>
